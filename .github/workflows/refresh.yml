name: Refresh Bundles & Patches
# Manual triggers refresh only the environment matching the selected branch

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: refresh-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: Production
            branch: refs/heads/main
          - environment: Development
            branch: refs/heads/dev

    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout matching source branch
        if: github.ref == matrix.branch
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Python
        if: github.ref == matrix.branch
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Export database sources before refresh
        if: github.ref == matrix.branch
        timeout-minutes: 2
        env:
          DEPLOY_ENDPOINT: ${{ vars.DEPLOY_ENDPOINT }}
          BACKEND_GIT_HOSTS: ${{ vars.BACKEND_GIT_HOSTS }}
        run: python .github/scripts/sync_sources.py --endpoint "$DEPLOY_ENDPOINT" --export "$RUNNER_TEMP/refresh-sources.json"

      - name: Sync database sources to ${{ matrix.branch }}
        if: github.ref == matrix.branch
        timeout-minutes: 3
        env:
          BACKEND_GIT_HOSTS: ${{ vars.BACKEND_GIT_HOSTS }}
          TARGET_REF: ${{ matrix.branch }}
        run: |
          TARGET_BRANCH="${TARGET_REF#refs/heads/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            # Reuse the export; only recompute additions after concurrent pushes.
            # This checkout contains only this job's generated manifest commit.
            git reset --hard "origin/$TARGET_BRANCH"
            python .github/scripts/sync_sources.py --sources-file "$RUNNER_TEMP/refresh-sources.json"
            git add src/main/resources/sources.toml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore(sources): sync ${{ matrix.environment }} database sources [skip ci]"
            if git push origin "HEAD:$TARGET_REF"; then
              exit 0
            fi
          done
          echo "Source sync could not push to $TARGET_REF after three attempts" >&2
          exit 1

      - name: Call refresh endpoint (${{ matrix.environment }})
        if: ${{ !cancelled() && github.ref == matrix.branch }}
        timeout-minutes: 2
        env:
          SECRET: ${{ secrets.BACKEND_AUTHENTICATION_SECRET }}
          DEPLOY_ENDPOINT: ${{ vars.DEPLOY_ENDPOINT }}
        run: |
          TIMESTAMP=$(date +%s)
          PAYLOAD="refresh:$TIMESTAMP"
          HMAC=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
          echo "Calling refresh on $DEPLOY_ENDPOINT (${{ matrix.environment }})"
          curl --fail-with-body --connect-timeout 15 --max-time 60 -X POST "$DEPLOY_ENDPOINT/api/v1/refresh/all" \
            -H "Authorization: Bearer $TIMESTAMP-$HMAC" \
            -H 'accept: application/json' \
            -d '' \
            -w "\nHTTP Status: %{http_code}\n"

  # This is ass I know, waiting for https://github.com/orgs/community/discussions/36919
  cleanup_deployment:
    name: 'Cleanup deployments'
    runs-on: ubuntu-latest
    needs: refresh
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Cleanup deployments
        run: |
          # Function to cleanup a deployment for a given environment
          cleanup_environment() {
            local environment=$1

            echo "Looking for $environment deployment..."

            DEPLOYMENT_ID=$(gh api repos/${{ github.repository }}/deployments \
              --method GET \
              --field sha=${{ github.sha }} \
              --field ref=${{ github.ref_name }} \
              --field task=deploy \
              --field environment="$environment" \
              --jq '.[0].id // empty')

            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "No $environment deployment found"
              return 0
            fi

            echo "Found $environment deployment ID: $DEPLOYMENT_ID"

            # Deactivate deployment
            echo "Deactivating $environment deployment..."
            gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              --method POST \
              --field state=inactive \
              --silent || echo "Failed to deactivate $environment deployment"

            # Delete deployment
            echo "Deleting $environment deployment..."
            gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID \
              --method DELETE \
              --silent || echo "Failed to delete $environment deployment"

            echo "$environment deployment cleanup complete"
          }

          # Cleanup both environments
          cleanup_environment "Production"
          cleanup_environment "Development"
